# Configuración de Netlify (se lee sola al importar el repo)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /api/* → Netlify Functions (netlify/functions). Va antes que la regla de React.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Las rutas de React (/login, /admin…) cargan la app.
# Los archivos que existen (data/*.json, assets) se sirven igual: Netlify no los pisa.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
