[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fotos de ImgBB por el CDN de Netlify
[images]
  remote_images = ["https://i\\.ibb\\.co/.*"]

# /api va a las funciones
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# El resto lo resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
